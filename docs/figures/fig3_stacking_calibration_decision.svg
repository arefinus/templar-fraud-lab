<text x='30' y='262' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#1F2A37'>Stacking weights and the calibration map are fitted on the validation split; the threshold grid is [0.001, 0.500] step 0.001 with lowest-threshold tie-break.</text>
<text x='30' y='279' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#1F2A37'>Missing p_escalation is a mask, never a zero; the disagreement proxy is the availability-weighted spread of the sources.</text>
